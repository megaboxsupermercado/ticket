<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatórios · Senhas do Açougue</title>
<link rel="stylesheet" href="/css/base.css">
<style>
  body { background: #f2f5f8; }
  .tela { max-width: 1040px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .topo { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 14px 18px; }
  .topo img { height: 48px; }
  .topo h1 { margin: 0; font-size: 1.3rem; flex: 1; }
  .filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; padding: 14px 18px; }
  .filtros label { display: grid; gap: 4px; font-size: .85rem; font-weight: 600; color: var(--cinza); }
  .filtros input { padding: 8px 10px; border: 2px solid #c9d3dc; border-radius: 8px; color: var(--azul); }
  .filtros .btn { padding: 10px 14px; font-size: .95rem; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .kpi { padding: 16px; }
  .kpi small { display: block; color: var(--cinza); font-weight: 600; font-size: .85rem; }
  .kpi b { display: block; font-size: 1.9rem; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: .8rem; color: var(--cinza); }
  .bloco { padding: 16px 18px; overflow-x: auto; }
  .bloco h2 { margin: 0 0 10px; font-size: 1.05rem; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid #e5ebf0; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--cinza); font-size: .85rem; }
  .vazio { color: var(--cinza); }
</style>
</head>
<body>
  <form class="login cartao oculto" id="formLogin">
    <img class="logo" src="/img/logo.png" alt="Megabox Supermercado">
    <h1>Relatórios do açougue</h1>
    <input id="senha" type="password" placeholder="Senha do dono" required>
    <button class="btn" type="submit">Entrar</button>
    <div class="aviso-erro" id="erroLogin"></div>
  </form>

  <main class="tela oculto" id="tela">
    <div class="topo cartao">
      <img src="/img/logo.png" alt="Megabox">
      <h1>Relatórios do açougue</h1>
      <button class="btn secundario" id="sair" type="button">Sair</button>
    </div>
    <div class="filtros cartao">
      <label>De <input type="date" id="de"></label>
      <label>Até <input type="date" id="ate"></label>
      <button class="btn" id="aplicar" type="button">Ver período</button>
      <button class="btn secundario" data-dias="0" type="button">Hoje</button>
      <button class="btn secundario" data-dias="6" type="button">7 dias</button>
      <button class="btn secundario" data-dias="29" type="button">30 dias</button>
      <button class="btn verde" id="planilha" type="button">Baixar planilha</button>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="bloco cartao">
      <h2>Por dia</h2>
      <table id="tabDia"></table>
    </div>
    <div class="bloco cartao">
      <h2>Movimento por horário (senhas emitidas)</h2>
      <table id="tabHora"></table>
    </div>
    <div class="aviso-erro" id="erro"></div>
  </main>

<script src="/js/comum.js"></script>
<script>
  const el = (id) => document.getElementById(id);
  const m = Senhas.minutos;
  let token = Senhas.ler('tokenDono');

  const iso = (d) => d.toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
  const br = (s) => s.split('-').reverse().join('/');
  function periodo(dias) {
    const hoje = new Date();
    el('ate').value = iso(hoje);
    el('de').value = iso(new Date(hoje.getTime() - dias * 864e5));
  }

  async function carregar() {
    el('erro').textContent = '';
    try {
      const q = `?de=${el('de').value}&ate=${el('ate').value}`;
      const r = await Senhas.api('/api/relatorios' + q, { token });
      const s = r.resumo;
      const kpi = (rot, val, sub) => `<div class="kpi cartao"><small>${rot}</small><b>${val}</b>${sub ? `<span>${sub}</span>` : ''}</div>`;
      el('kpis').innerHTML =
        kpi('Clientes atendidos', s.atendidas, `${s.emitidas} senhas emitidas`) +
        kpi('Espera média', m(s.espera_media), `Normal ${m(s.espera_media_n)} · Pref. ${m(s.espera_media_p)}`) +
        kpi('Maior espera', m(s.espera_max)) +
        kpi('Atendimento médio', m(s.atendimento_medio), 'no balcão') +
        kpi('Ausentes e desistências', s.ausentes + s.desistencias, `${s.ausentes} ausentes · ${s.desistencias} desistências`);

      el('tabDia').innerHTML = r.porDia.length
        ? '<tr><th>Dia</th><th>Emitidas</th><th>Atendidas</th><th>Espera média</th><th>Atendimento médio</th></tr>' +
          r.porDia.map((d) => `<tr><td>${br(d.dia)}</td><td>${d.emitidas}</td><td>${d.atendidas}</td><td>${m(d.espera_media)}</td><td>${m(d.atendimento_medio)}</td></tr>`).join('')
        : '<tr><td class="vazio">Nenhuma senha no período</td></tr>';

      el('tabHora').innerHTML = r.porHora.length
        ? '<tr><th>Horário</th><th>Senhas emitidas</th><th>Espera média</th></tr>' +
          r.porHora.map((h) => `<tr><td>${String(h.hora).padStart(2, '0')}h às ${String(h.hora + 1).padStart(2, '0')}h</td><td>${h.emitidas}</td><td>${m(h.espera_media)}</td></tr>`).join('')
        : '<tr><td class="vazio">Nenhuma senha no período</td></tr>';
    } catch (e) {
      if (e.status === 401) return sair();
      el('erro').textContent = e.message;
    }
  }

  function sair() {
    token = null; Senhas.apagar('tokenDono');
    el('formLogin').classList.remove('oculto'); el('tela').classList.add('oculto');
  }
  function entrar() {
    el('formLogin').classList.add('oculto'); el('tela').classList.remove('oculto');
    periodo(0); carregar();
  }

  el('formLogin').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    try {
      const r = await Senhas.api('/api/login', { metodo: 'POST', corpo: { perfil: 'dono', senha: el('senha').value } });
      token = r.token; Senhas.guardar('tokenDono', token); entrar();
    } catch (e) { el('erroLogin').textContent = e.message; }
  });
  el('sair').addEventListener('click', sair);
  el('aplicar').addEventListener('click', carregar);
  document.querySelectorAll('[data-dias]').forEach((b) => b.addEventListener('click', () => { periodo(Number(b.dataset.dias)); carregar(); }));
  el('planilha').addEventListener('click', () => {
    location.href = `/api/relatorios/planilha?de=${el('de').value}&ate=${el('ate').value}&token=${encodeURIComponent(token)}`;
  });

  if (token) entrar(); else sair();
</script>
</body>
</html>
